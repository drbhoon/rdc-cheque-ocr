services:
  # ── Flask application ──────────────────────────────────────────────────────
  rdc-cheque-ocr-service:
    build: .
    image: rdc-cheque-ocr:prod
    container_name: rdc-cheque-ocr-service
    restart: unless-stopped
    # All config (API keys, DB URL, SMTP, …) comes from .env
    env_file:
      - .env
    # Host 3001 -> container 3001 (Gunicorn binds 3001; host and container ports match)
    ports:
      - "3001:3001"
    # Marks the container unhealthy when gunicorn can no longer serve a
    # request (all threads wedged). Docker will NOT restart an unhealthy
    # container by itself — watchdog.sh (host cron) does that.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Don't start the app until Postgres is accepting connections, so the
    # app's first-run table creation succeeds.
    depends_on:
      rdc-postgres-db:
        condition: service_healthy

  # ── PostgreSQL (local, persistent) ─────────────────────────────────────────
  rdc-postgres-db:
    image: postgres:15-alpine
    container_name: rdc-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres listens on 3002 inside the container so host and container ports match
    # (5432 is taken by another app on the server).
    command: ["-p", "3002",
              "-c", "idle_session_timeout=300000",
              "-c", "idle_in_transaction_session_timeout=60000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 3002 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Host 3002 -> container 3002 (for DB admin tools like pgAdmin from the host).
    # The app reaches the DB over the internal compose network at
    # "rdc-postgres-db:3002" (see DATABASE_URL in .env).
    ports:
      - "3002:3002"

volumes:
  postgres_data:
