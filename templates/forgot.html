<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — RDC Cheque Tracking and Control System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 16px; padding: 40px 34px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo img { height: 52px; background: #fff; border-radius: 10px; padding: 3px 8px; object-fit: contain; }
    .logo h1 { font-size: 17px; font-weight: 700; }
    .logo p { font-size: 13px; color: #6b7280; margin-top: 2px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .6px; color: #6b7280; margin: 16px 0 6px; }
    input { width: 100%; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      padding: 11px 14px; color: #e2e8f0; font-size: 14px; outline: none; transition: border-color .2s; }
    input:focus { border-color: #4f6ef7; }
    .btn { margin-top: 22px; width: 100%; padding: 13px; background: linear-gradient(135deg,#4f6ef7,#7c3aed);
      border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .ok { font-size: 14px; padding: 12px 15px; border-radius: 9px; background: rgba(34,197,94,0.1);
      color: #4ade80; border: 1px solid rgba(34,197,94,0.3); line-height: 1.5; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 8px; line-height: 1.5; }
    .back { margin-top: 16px; text-align: center; font-size: 13px; }
    .back a { color: #7c9bff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/static/rdc-logo.jpg" alt="RDC — We Promise We Deliver" />
      <div><h1>Forgot Password</h1><p>We'll email you a reset link</p></div>
    </div>
    {% if sent %}
    <div class="ok">
      If <b>{{ email }}</b> has an account, a password-reset link has been sent to it.
      The link is valid for 60 minutes.
    </div>
    <div class="hint">Didn't get it? Check spam, confirm you used your work email, or ask HO Admin.</div>
    {% else %}
    <form method="POST" action="/forgot">
      <label for="email">Your work email</label>
      <input type="email" id="email" name="email" autocomplete="username" required autofocus
             placeholder="you@rdc.in" />
      <button class="btn" type="submit">Send reset link</button>
    </form>
    {% endif %}
    <div class="back"><a href="/login">← Back to sign in</a></div>
  </div>
</body>
</html>
