<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password — Cheque Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 16px; padding: 40px 34px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg,#4f6ef7,#7c3aed);
      border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .logo h1 { font-size: 19px; font-weight: 700; }
    .logo p { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .note { font-size: 13px; color: #fbbf24; background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.3); border-radius: 9px; padding: 10px 14px; margin-bottom: 6px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .6px; color: #6b7280; margin: 16px 0 6px; }
    input { width: 100%; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
      padding: 11px 14px; color: #e2e8f0; font-size: 14px; outline: none; transition: border-color .2s; }
    input:focus { border-color: #4f6ef7; }
    .btn { margin-top: 24px; width: 100%; padding: 13px; background: linear-gradient(135deg,#4f6ef7,#7c3aed);
      border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .err { margin-top: 18px; font-size: 14px; padding: 11px 15px; border-radius: 9px;
      background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔑</div>
      <div><h1>Set Your Password</h1><p>{{ user.email if user }}</p></div>
    </div>
    {% if forced %}
    <div class="note">Welcome! For security you must set your own password before using the app.</div>
    {% endif %}
    <form method="POST" action="/password">
      <label for="current">Current password</label>
      <input type="password" id="current" name="current" autocomplete="current-password" required autofocus />
      <label for="new">New password</label>
      <input type="password" id="new" name="new" autocomplete="new-password" minlength="8" required />
      <div class="hint">At least 8 characters. Don't reuse the default password.</div>
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required />
      <button class="btn" type="submit">Save Password</button>
    </form>
    {% if error %}<div class="err">⚠ {{ error }}</div>{% endif %}
  </div>
</body>
</html>
